# OpenGym production deployment — one gym, one server.
#
# The development compose file (docker-compose.yml) runs only Mongo and Redis;
# the API runs on the host. This file brings the whole stack up in containers
# and exposes nothing but the reverse proxy.
#
# Usage:
#   cp .env.production.example .env   and fill in the values left blank
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The panel and the API are served from the SAME domain. That is a requirement,
# not a preference: the panel calls the API over relative paths (/api/...) with
# a cookie session, and separate domains would make those cookies third-party
# and break the session.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      # The certificate is issued for this domain; DNS must point at this server.
      DOMAIN: ${DOMAIN:?DOMAIN must be set}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    # As PID 1, Node does not reap zombie processes; init also guarantees that
    # signals are forwarded properly, which graceful shutdown depends on.
    init: true
    # Allows in-flight requests and the turnstile event consumer to finish after
    # SIGTERM; the application's own timeout is 15s.
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: mongodb://${MONGO_USER:?MONGO_USER must be set}:${MONGO_PASSWORD:?MONGO_PASSWORD must be set}@mongo:27017/opengym?authSource=admin
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set}@redis:6379
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      BETTER_AUTH_URL: https://${DOMAIN}
      TRUSTED_ORIGINS: https://${DOMAIN}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
      # So that report days are cut according to the gym's local day.
      REPORTS_TIME_ZONE: ${REPORTS_TIME_ZONE:-Europe/Istanbul}
      # R2 is REQUIRED in production: the API validates the configuration at
      # startup (assertProductionProfilePhotoConfig) and refuses to boot when it
      # is incomplete. Requiring it here too makes the failure legible at the
      # compose level.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?R2_ACCOUNT_ID must be set}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?R2_ACCESS_KEY_ID must be set}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?R2_SECRET_ACCESS_KEY must be set}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?R2_BUCKET_NAME must be set}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:?R2_PUBLIC_BASE_URL must be set}
      # SMTP is optional, but LEFT EMPTY the verification codes are written to
      # the container log instead of being e-mailed — on a real install members
      # cannot finish signing up. Fill it in for production.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-OpenGym <noreply@opengym.local>}
    healthcheck:
      # Probes readiness rather than liveness: a container whose process is up
      # but whose Mongo/Redis connection is gone must not count as healthy.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      # The phone backfill and index setup run at startup; failed probes during
      # that window do not mark the container unhealthy.
      start_period: 60s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  mongo:
    image: mongo:8
    restart: unless-stopped
    # NO port is published to the host. The database is reachable only over the
    # compose network; authentication is still enabled (a single layer is not
    # trusted).
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:?MONGO_USER must be set}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--quiet",
          "-u",
          "${MONGO_USER}",
          "-p",
          "${MONGO_PASSWORD}",
          "--authenticationDatabase",
          "admin",
          "--eval",
          "db.runCommand('ping').ok",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # appendonly: the turnstile event queue waits in Redis, and unwritten events
    # in that queue must not be lost across a restart.
    command:
      [
        "redis-server",
        "--requirepass",
        "${REDIS_PASSWORD:?REDIS_PASSWORD must be set}",
        "--appendonly",
        "yes",
      ]
    environment:
      # redis-cli picks this up on its own, so the healthcheck and any manual
      # maintenance command authenticate without putting the password in the
      # process arguments, where the container's process list would expose it.
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  mongo-data:
  redis-data:
  # Let's Encrypt certificates live here. Losing this volume means the
  # certificates are re-issued, which can run into ACME rate limits.
  caddy-data:
  caddy-config:
