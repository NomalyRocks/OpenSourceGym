server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS and the security headers are terminated at the reverse proxy (Caddy);
    # this server only hands out static files.

    # Vite stamps a content hash into the file names, so the assets can be
    # cached permanently.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NEVER be cached: if the browser keeps an old copy after a
    # deployment it asks for hashed assets that no longer exist, and the panel
    # comes up as a blank screen.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA routing: react-router paths have no file behind them on the server, so
    # unknown paths fall through to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # A cheap endpoint that lets the reverse proxy tell the container is up.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
