server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # TLS ve güvenlik başlıkları ters vekilde (Caddy) sonlandırılır; burada
    # yalnızca statik dosya sunumu yapılır.

    # Vite dosya adlarına içerik hash'i basar, bu yüzden varlıklar kalıcı
    # olarak önbelleğe alınabilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html ASLA önbelleğe alınmamalı: dağıtımdan sonra tarayıcı eski
    # kopyayı tutarsa artık var olmayan hash'li varlıkları ister ve panel
    # boş ekranla açılır.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # SPA yönlendirmesi: react-router yolları sunucuda dosya karşılığı olmadığı
    # için bilinmeyen yollar index.html'e düşer.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Ters vekilin konteynerin ayakta olduğunu anlaması için ucuz bir uç.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
