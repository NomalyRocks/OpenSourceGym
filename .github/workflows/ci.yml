name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mongo:
        # Pinned: mongo:8 now resolves to 8.3.x, which refuses to start on the
        # runner's Linux >= 6.19 kernel (SERVER-121912). Unpin once fixed.
        image: mongo:8.2.6
        ports:
          - 27017:27017
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
    env:
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017
      TEST_REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ahead of lint: formatting drift is the cheapest failure to diagnose, and
      # three merged PRs accumulated it while every other gate stayed green.
      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
