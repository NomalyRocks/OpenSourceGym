version: 2

# Kept deliberately quiet: one monthly run per ecosystem, every routine bump in
# a single PR and every major in a second one. Security updates are not on a
# schedule; they still open as soon as an advisory lands, batched into one PR.
updates:
  # pnpm workspace: Dependabot resolves the whole monorepo from the root lockfile,
  # so one entry covers apps/* and packages/* as well.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Istanbul"
    # Skip releases younger than a week. pnpm's minimumReleaseAge check rejects
    # day-old versions in CI, and a week also lets broken releases get yanked.
    # Cooldown applies to version updates only, never to security updates.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Every minor/patch bump, production and development alike, in one PR.
      minor-patch:
        patterns: ["*"]
        update-types:
          - "minor"
          - "patch"
      # Majors need a code review of their own, but still arrive as one PR.
      major:
        patterns: ["*"]
        update-types:
          - "major"
      # Advisory fixes batched into one PR instead of one per package.
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Expo SDK majors move react-native, react and the whole native toolchain
      # together; they must go through `expo install` / an SDK upgrade, not a
      # lockfile bump. Security alerts are unaffected by these ignores.
      - dependency-name: "expo"
        update-types: ["version-update:semver-major"]
      # An Expo SDK pins one react-native minor (a 0.x minor is a breaking
      # release) and an exact react; react-dom must match react exactly, so the
      # web panel's react follows the SDK too.
      - dependency-name: "react-native"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-dom"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      # Every expo-* module's major version tracks the SDK (expo-secure-store 58
      # belongs to SDK 58), so a major bump means leaving SDK 57.
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      # @expo/* tooling (e.g. @expo/config-plugins) is versioned with the SDK too.
      - dependency-name: "@expo/*"
        update-types: ["version-update:semver-major"]
      # Native libs that Expo SDK 57 pins in bundledNativeModules.json. Move them
      # with `expo install --fix`; the CI `expo install --check` gate enforces it.
      # Exact SDK pins are ignored entirely.
      - dependency-name: "@shopify/react-native-skia"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      # The SDK pins a ~ range here, so only patch bumps stay safe.
      - dependency-name: "react-native-safe-area-context"
        update-types:
          ["version-update:semver-major", "version-update:semver-minor"]
      # Node typings must match the runtime (engines: node >= 22, CI on Node 22);
      # a newer @types/node major would type APIs the runtime does not have.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "06:00"
      timezone: "Europe/Istanbul"
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
